# Runs on every pull request and every push to main: lint, format, unit tests (GUT) and the
# multiplayer smoke test (eight scenarios incl. stress, latency and fairness, headless; a pull
# request runs only the scenarios its changes need, see tools/check_scope.json). Uses the official Godot 4.7.2 release.
name: checks

on:
  pull_request:
    # labeled: adding full-checks reruns everything.
    types: [opened, synchronize, reopened, labeled]
    # A pull request that only changes these runs nothing: no check reads them. Guides
    # (CLAUDE.md, .claude/skills) still run, because tests/test_guides.gd checks their paths.
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches: [main]

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - name: Check out (with Git LFS files)
        uses: actions/checkout@v4
        with:
          lfs: true
          # The whole history, so a pull request can be compared with its base branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: python -m pip install "gdtoolkit==4.*"

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          $zip = "Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\godot"
          "GODOT=$env:RUNNER_TEMP\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe" | Out-File $env:GITHUB_ENV -Append

      # The same script developers run locally: import (retried, Godot 4.7.2's import sometimes
      # crashes while it builds its cache), GUT, gdlint and gdformat --check.
      - name: Import, tests, lint, format
        run: .\tools\check.ps1 -LogDir "$env:RUNNER_TEMP\check_logs"

      # A pull request runs only the scenarios its changes need (tools/check_scope.json), unless
      # it has the full-checks label. A push to main always runs every scenario, so anything
      # the rules miss is still caught there.
      - name: Multiplayer smoke test
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-checks') }}
          BASE: origin/${{ github.base_ref }}
        run: |
          if ($env:FULL -eq "true") {
            .\tests\net\run_smoke.ps1 -LogDir "$env:RUNNER_TEMP\smoke_logs"
          } else {
            .\tools\check.ps1 -Changed -Only smoke -Base $env:BASE -LogDir "$env:RUNNER_TEMP\check_logs"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            ${{ runner.temp }}\smoke_logs
            ${{ runner.temp }}\check_logs
          if-no-files-found: ignore
