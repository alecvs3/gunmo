# Temporary: runs smoke scenario G (latency) four times on each listed commit, in parallel, and
# prints its clean-phase metrics. Lives only on the bisect/g branch.
name: bisect-g

on:
  push:
    branches: [bisect/g]

jobs:
  g:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        commit: ["872b7d26bc0ac351a8ac339ccab154e9dc1dff2e", "0654072587b91ee7475fa671cf6572fcce1caf5d", "ba5d6330f11d446375b706fcfe90e29ce1d2f3af", "71c300c140615da629a4510279dbf217509b66f9", "4ad4acfdd621bac16cbbc0b3fd4baccc3b4f4963", "63136d430ca134c564392985917624049de2f02e", "720b8e2fbcb79369d6fc42b8fa1c7a6941f26e08", "c6e947ab1171298154acd6f0adb3d4404df7aee3", "bad8060fa317be4707831d4e016b711eb8d1a9a2", "27fcc0f9f59ffe0edbd04bb922f96de8a1e2c907"]
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          lfs: true
      - name: Download Godot
        run: |
          $zip = "Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\godot"
          "GODOT=$env:RUNNER_TEMP\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe" | Out-File $env:GITHUB_ENV -Append
      - name: Import
        run: .\tools\check.ps1 -Only import -LogDir "$env:RUNNER_TEMP\logs"
      - name: G four times
        run: |
          foreach ($i in 1..4) {
            $out = & .\tests\net\run_smoke.ps1 -Godot $env:GODOT -LogDir "$env:RUNNER_TEMP\g$i" -Only G *>&1 | ForEach-Object { "$_" }
            $m = @($out | Select-String "clean_smoothing_p95_ms|clean_smoothing_excess_ms|clean_snapshot_jitter_ms|clean_smoothing_avg_ms" | ForEach-Object { ($_.Line -replace '\s+', ' ').Trim() })
            Write-Host "BISECT ${{ matrix.commit }} run $i : $($m -join ' | ')"
          }
