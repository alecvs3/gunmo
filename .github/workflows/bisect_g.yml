# Temporary: runs smoke scenario G (latency) four times on each listed commit, in parallel, and
# prints its clean-phase metrics. Lives only on the bisect/g branch.
name: bisect-g

on:
  push:
    branches: [bisect/g]

jobs:
  g:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [control, no_effects, no_panel, no_follower, none]
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27fcc0f9f59ffe0edbd04bb922f96de8a1e2c907
          lfs: true
      - name: Download Godot
        run: |
          $zip = "Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\godot"
          "GODOT=$env:RUNNER_TEMP\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe" | Out-File $env:GITHUB_ENV -Append
      - name: Remove the suspect
        run: |
          $v = "${{ matrix.variant }}"
          if ($v -eq "no_effects" -or $v -eq "none") {
            (Get-Content levels/level.gd -Raw).Replace("`tadd_child(PetEffects.new())`n", "") | Set-Content levels/level.gd -NoNewline
          }
          if ($v -eq "no_panel" -or $v -eq "none") {
            (Get-Content main.tscn -Raw).Replace('[node name="PetPanel" parent="UI" instance=ExtResource("12_pets")]', '') | Set-Content main.tscn -NoNewline
          }
          if ($v -eq "no_follower" -or $v -eq "none") {
            (Get-Content player/player.gd -Raw).Replace("`tadd_child(PetFollower.new())`n", "") | Set-Content player/player.gd -NoNewline
          }
          git diff --stat
      - name: Import
        run: .\tools\check.ps1 -Only import -LogDir "$env:RUNNER_TEMP\logs"
      - name: G four times
        run: |
          foreach ($i in 1..4) {
            $out = & .\tests\net\run_smoke.ps1 -Godot $env:GODOT -LogDir "$env:RUNNER_TEMP\g$i" -Only G *>&1 | ForEach-Object { "$_" }
            $m = @($out | Select-String "clean_smoothing_p95_ms|clean_smoothing_excess_ms|clean_snapshot_jitter_ms|clean_smoothing_avg_ms" | ForEach-Object { ($_.Line -replace '\s+', ' ').Trim() })
            Write-Host "BISECT ${{ matrix.variant }} run $i : $($m -join ' | ')"
          }
