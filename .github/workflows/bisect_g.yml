# Temporary (base = #131, test = main with PetPowers parts off): an A/B of smoke scenario G (latency) on the same machine. Each job checks out the
# code from before today (base) and the code under test (main, with one variant change) side by
# side and alternates G runs between them, so the machine's speed cancels out.
name: bisect-g

on:
  push:
    branches: [bisect/g]

jobs:
  g:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [control, no_tick, no_wizard_tick, no_soldier_tick, no_powers_node]
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4ad4acfdd621bac16cbbc0b3fd4baccc3b4f4963
          fetch-depth: 0
          path: base
          lfs: true
      - uses: actions/checkout@v4
        with:
          ref: 27fcc0f9f59ffe0edbd04bb922f96de8a1e2c907
          fetch-depth: 0
          path: test
          lfs: true
      - name: Download Godot
        run: |
          $zip = "Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\godot"
          "GODOT=$env:RUNNER_TEMP\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe" | Out-File $env:GITHUB_ENV -Append
      - name: Variant (current main, PetPowers parts switched off)
        working-directory: test
        run: |
          $v = "${{ matrix.variant }}"
          $f = "pets/pet_powers.gd"
          $t = Get-Content $f -Raw
          if ($v -eq "no_tick") { $t = $t.Replace("func _physics_process(_delta: float) -> void:`n", "func _physics_process(_delta: float) -> void:`n`treturn`n") }
          if ($v -eq "no_wizard_tick") { $t = $t.Replace("`t_wizard.tick(players, NetworkManager.clock.tick)`n", "") }
          if ($v -eq "no_soldier_tick") { $t = $t.Replace("`t_soldier.tick(players, NetworkManager.clock.tick)`n", "") }
          if ($v -eq "no_powers_node") { $t = $t.Replace("func _ready() -> void:`n", "func _ready() -> void:`n`tset_physics_process(false)`n`tset_process(false)`n") }
          Set-Content $f $t -NoNewline
          git diff
      - name: Import both
        run: |
          .\base\tools\check.ps1 -Only import -LogDir "$env:RUNNER_TEMP\ib"
          .\test\tools\check.ps1 -Only import -LogDir "$env:RUNNER_TEMP\it"
      - name: Alternate G runs
        run: |
          foreach ($i in 1..4) {
            foreach ($side in @("base", "test")) {
              $out = & ".\$side\tests\net\run_smoke.ps1" -Godot $env:GODOT -LogDir "$env:RUNNER_TEMP\$side$i" -Only G *>&1 | ForEach-Object { "$_" }
              $m = @($out | Select-String "clean_smoothing_p95_ms|clean_smoothing_excess_ms" | ForEach-Object { ($_.Line -replace '\s+', ' ').Trim() })
              Write-Host "AB ${{ matrix.variant }} $side $i : $($m -join ' | ')"
            }
          }
